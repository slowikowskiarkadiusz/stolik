[package]
name = "common"
version = "0.0.1"
edition = "2024"

[features]
default = ["std"]
std = ["embassy-time/std", "critical-section/std", "rand/std", "serde_json", "serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
critical-section = { version = "1.2.0" }
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "rwlock", "spin_mutex"] }
embassy-sync = { version = "0.7.2", default-features = false }
embassy-time = { version = "0.5.0", default-features = false }
esp-println = "0.16.1"
libm = { version = "0.2.16", default-features = false }
